# motion_planning + robot_controller 공용 환경 (Ubuntu 22.04 / ROS 2 Humble)
# 신규: bash miniforge/setup.sh control
# 갱신: bash miniforge/setup.sh control --update
name: vehicle_painting_robot_motion_planning
channels:
  - conda-forge
  - nodefaults
dependencies:
  # 시스템 ROS Humble의 Python ABI와 맞춘다. ROS 자체는 Conda에 설치하지 않는다.
  - python=3.10
  - pip
  - setuptools=79.0.1
  - numpy=1.26.4
  # Python 바인딩과 제어 .so 빌드용 C++ 헤더/라이브러리를 함께 설치한다.
  - pinocchio=3.9.0
  - casadi=3.7.2
  - eigen=3.4.0
  - libstdcxx=16.2.0
  - libgcc=16.2.0
  # 현재 motion_planning에서 검증한 수치 계산 / YAML 패키지.
  - scipy=1.15.2
  - pyyaml=6.0.3
  - pip:
      # 제어 환경의 Python으로 ROS 패키지를 빌드하기 위한 도구.
      - colcon-common-extensions==0.3.0
      - catkin_pkg==1.1.1
      - empy==3.3.4
      - lark==1.3.1
  # Orbbec SDK/Open3D는 설치하지 않는다. DRFL은 프로젝트의 API-DRFL을 사용한다.
