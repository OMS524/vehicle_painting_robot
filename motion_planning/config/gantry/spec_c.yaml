# 갠트리 환경 "spec_c" — 사용자 확정 스펙 (2026-09-06). 툴체인저/도킹(dock_path, cell_view.launch)의 기본 환경.
#
# URDF 는 gantry.stl 분리 메시 + 수작업 편집본(paint_cell_8axis_gantry_mesh_c.urdf) 이라 생성기로
# 재현하지 않는다(generated: false). 아래 값은 그 URDF 에서 그대로 옮긴 것이다.
gantry_env:
  name: spec_c
  title: "확정 스펙 3.0 x 2.4 m 레일, 레일 높이 2.1805 m, 코너 원점·축 반전, 툴체인저 4슬롯"
  convention: corner    # 조인트 0 = 툴체인저 쪽 X 끝 / +Y 끝 코너. +명령 = -X / -Y 방향.
  rail:
    x_length: 3.0
    y_length: 2.4
    z_height: 2.1805    # 브리지 중심 = 레일 높이 [m]
  stroke:               # 정상 운전 스트로크 = 레일 길이 - 슬라이더군 여유 (X 0.1736, Y 0.1136)
    x: 2.8264
    y: 2.2864
  joints:
    gantry_x: {axis: [-1, 0, 0], lower: 0.0, upper: 2.8264, origin_xyz: [1.4132, 0.0, 2.1805]}
    gantry_y: {axis: [0, -1, 0], lower: 0.0, upper: 2.2864, origin_xyz: [0.0, 1.1432, 0.0]}
  mount_z: 2.0275       # = z_height - 0.153
  arm_mount:
    xyz: [0.32304, 0.0, -0.153]
    rpy: [3.141592653589793, 0.0, -1.5707963267948966]
  urdf:
    generated: false
    primitive: paint_cell_8axis_gantry_mesh_c.urdf   # 프리미티브 팔 변형이 없어 메시본을 그대로 쓴다 (운동학 동일)
    mesh: paint_cell_8axis_gantry_mesh_c.urdf
    bare: paint_cell_8axis_gantry_mesh_c_bare.urdf   # 툴 없는 플랜지판 (도킹 접근 검증용)
    collision: paint_cell_8axis_gantry_mesh_c.urdf
    arm_source: $REPO/robot_controller/doosan_a0912_controller/urdf/a0912.white.urdf
  frame: null           # 메시 기반 — 생성기 치수 없음
  toolchanger:
    # 슬롯/스탠드 좌표는 anchor 기준 상대값. anchor = 캐리지 월드 이동범위 끝(x_max=+1.4132, y_min=-1.1432) + 팔 장착면 높이(mount_z=2.0275).
    # 새 환경에서 같은 상대 위치에 두면 도킹 기하(팔 base-슬롯 관계)가 그대로 유지된다 (스탠드는 그만큼 높은 받침 위에 놓인다고 본다).
    anchor: {x: x_max, y: y_min, z: mount_z}
    plate_size: [0.102, 0.080, 0.044]   # 파킹 플레이트 (X, Y, Z)
    slots:   # 월드 = anchor + (dx, dy, dz). dz = 플레이트 상면 - mount_z. spec_c 월드: slot_1 (1.3311,-1.3019,0.9152) ...
      - {name: toolchanger_slot_1, dx: -0.0821, dy: -0.1587, dz: -1.1123, occupied: true}
      - {name: toolchanger_slot_2, dx:  0.1179, dy: -0.1587, dz: -1.1123, occupied: true}
      - {name: toolchanger_slot_3, dx: -0.0821, dy: -0.3587, dz: -0.7853, occupied: true}
      - {name: toolchanger_slot_4, dx:  0.1179, dy: -0.3587, dz: -0.7853, occupied: false}
    # 스탠드 collision 박스 (gantry_base.stl 실측). center = anchor 상대 (dx, dy, dz: 팔 장착면 기준). 생성형 환경에서만 URDF 에 들어간다.
    stand_boxes:
      - {center: [0.0238, -0.2298, -1.173014], size: [0.310, 0.190, 0.073]}
      - {center: [-0.3092, -0.3498, -1.506500], size: [0.050, 0.400, 0.050]}
      - {center: [-0.3092, -0.3498, -1.179514], size: [0.070, 0.400, 0.16243]}
      - {center: [-0.3092, -0.3498, -0.852527], size: [0.070, 0.400, 0.110]}
      - {center: [-0.1151, -0.3098, -1.368613], size: [0.318198, 0.030, 0.318198]}
      - {center: [-0.0492, -0.3098, -1.179514], size: [0.450, 0.030, 0.060]}
      - {center: [0.0238, -0.4298, -0.846027], size: [0.310, 0.190, 0.073]}
      - {center: [-0.1151, -0.5098, -1.041626], size: [0.318198, 0.030, 0.318198]}
      - {center: [-0.0492, -0.5098, -0.852527], size: [0.450, 0.030, 0.060]}
    stand_riser: {dx: -0.3092, dy: -0.3498, size_xy: [0.07, 0.40]}   # 최하단 박스 아래를 바닥까지 받치는 기둥
    dock:          # dock_path.py 기본값
      gantry_x_joint: 0.0        # 도킹 시 gantry_x 조인트값 (0 = 툴체인저 쪽 X 끝)
      pre_offset: 0.15           # pre-dock 높이 (플레이트 상면 +Z) [m]
      standoff: 0.005            # dock 시 플랜지-플레이트 간격 [m]
      dock_frame: link_6         # 도킹 기준 프레임 (빈 플랜지)
  home:
    gantry: [0.0, 0.0]            # 코너 홈
    arm_deg: [0, 0, 0, 0, 0, 0]   # dock_path START_ARM_DEG
    travel_arm_deg: [0, 0, 90, 0, 90, 0]   # 이송 자세 (dock_path TRAVEL_ARM_DEG)
  motor_limits:
    # 2026-10-20 사용자: 갠트리 모터 최고속도 0.8 m/s. 계획은 안전 마진을 두고 0.5 m/s 로 한다 (NLP 제약, stitch/sequence
    # 전이 시간 배분 공통). 가속도 1.6 m/s^2 는 2026-10-20 사용자 지정값(종전 5.0, 처음 가정 2.0).
    gantry_velocity_m_s: 0.5
    gantry_acceleration_m_s2: 1.6
  nlp:
    initial_joint: "1.4132,1.1432,90,0,90,-90,0,0"   # 갠트리 중앙 + legacy 와 같은 팔 자세
    gantry_velocity_weight: 0.01         # x7y4z3 와 동일 (trajectory_nlp 갠트리 부드러움 항, 스윕 근거는 x7y4z3.yaml)
    gantry_acceleration_weight: 0.01
    node_limit_scale: "0.85,0.25"
  part_placement:
    # legacy 월드 기준 part_xyz 에 더할 값. z = mount_z - 2.066 (팔 base 대비 부품 높이를 legacy 와 같게 유지)
    xyz_offset: [0.0, 0.0, -0.0385]
