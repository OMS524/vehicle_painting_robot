painting_trajectory:
  surface_extraction:
    # 슬라이싱 모드: axis / surface_adaptive
    # axis: 도장 방향과 스캔 방향으로 만든 작업 좌표계의 고정 축 기준 슬라이싱
    # surface_adaptive: 인접 strip에서 반복 지지되는 위·아래 범위가 가장 긴 위치의 upper hull을 따라 슬라이싱
    slicing_method: surface_adaptive
    # 로컬 작업 좌표계에서 슬라이스를 시작할 방향: top / bottom / left / right
    spline_start_side: top
    # 첫 슬라이스 시작 오프셋 [m]. axis는 기준축 거리, surface_adaptive는 가이드라인 누적 아크길이 기준
    spline_start_offset: 0.02
    # 인접한 슬라이스 row 사이 간격 [m]
    spline_spacing: 0.05
    # 각 local slicing plane에서 raw 점군을 모을 때 쓰는 slab 반두께 [m]
    spline_half_width: 0.005
    # surface_adaptive 모드에서 PCA 표면 법선 추정 시 각 점의 최근접 이웃 개수
    geodesic_normal_neighbor_count: 20
    # surface_adaptive occupancy row bin과 local slicing plane slab의 기준 반폭 [m]. 0 이하면 spline_half_width 사용
    geodesic_band_half_width: 0.0
    # guide strip 선택 시 (row-axis, slice-axis) occupancy cell의 최소 점 개수
    guide_extension_min_bin_points: 8
    # 이 개수보다 점이 적으면 local slicing slab 폭을 단계적으로 넓힘
    geodesic_min_band_points: 8
    # 인접 slicing direction의 각도 차이에 따라 중간 슬라이스를 추가하는 기준 각도 [deg]
    # 예: 40도 차이이면 1개 추가(20도씩), 70도 차이이면 2개 추가(약 23.33도씩). 0 이하면 비활성화
    curvature_slice_angle_deg: 20.0

  correction:
    endpoint:
      # endpoint 추출용 그래프를 만들기 전 점군을 정리할 때 쓰는 양자화 간격 [m]
      quantize_step: 0.001
      # component 그래프 구성 시 각 점이 연결할 최근접 이웃 개수
      graph_neighbor_count: 10
      # 이 arc 길이보다 짧은 component는 노이즈로 보고 버림 [m]
      component_min_arc_length: 0.003
      # component 병합 시 다음 component 시작점이 현재 끝점보다 이 거리 이상 왼쪽이면 병합 중단 [m]
      component_merge_backtrack_tolerance: 0.1

    support:
      # 보정 전에 선택된 upper hull를 다시 샘플링하는 간격 [m]
      support_point_spacing: 0.0025
      # 각 hull 샘플점의 로컬 접선 방향으로 raw 표면 점을 찾을 때 쓰는 탐색 반폭 [m]
      tangent_half_width: 0.0025
      # raw 표면 점과 이 거리보다 멀면 anchor로 취급하지 않음 [m]
      anchor_max_distance: 0.25
      # unsupported 구간 양끝에 추가로 풀어줄 transition 샘플 개수
      transition_count: 4
      # 전체 hull 양끝에서 anchor를 풀어둘 transition 샘플 개수
      endpoint_transition_count: 8

    optimization:
      # 시작점/끝점을 원래 upper hull 끝점 근처에 유지하는 soft 항의 가중치
      lambda_end: 0.01
      # 기준 upper hull 근처에 머물도록 하는 항의 가중치
      lambda_data: 0.1
      # 1차 차분(로컬 흐름 / 간격) 유지 항의 가중치
      lambda_stretch: 1.0
      # 2차 차분 최소화(급격한 꺾임 / 접힘 억제) 항의 가중치
      lambda_bend: 100.0
      # 최적화 수치 안정화를 위한 작은 regularizer
      regularizer: 1.0e-9

  offset:
    # offset 생성 전 corrected row를 다시 샘플링하는 간격 [m]
    offset_point_spacing: 0.025
    # corrected surface path에서 법선 방향으로 떨어질 offset 거리 [m]
    offset_distance: 0.15

  spline:
    # spline arc-length table 생성을 위한 내부 샘플링 해상도 [m]
    spline_point_spacing: 0.0001
    # 최종 경로 포인트의 고정 아크길이 간격 [m]
    final_point_spacing: 0.04
    # 생성된 paint spline 양 끝을 끝 접선 방향으로 직선 연장할 길이 [m]
    endpoint_extension_length: 0.1
    # trajectory row를 생성하기 전에 한 줄씩 번갈아 뒤집어 지그재그 진행 방향으로 만들지 여부
    raster_zigzag: true
    # 분사 T/F 검사 시 TCP position으로부터 분사 방향으로 볼 최대 거리 [m] (권장값: offset_distance + 추가 거리)
    paint_check_distance: 0.45
    # 분사 T/F 검사 시 2D 검사 영역의 반폭 [m]
    paint_check_half_width: 0.005
    # 분사 T/F 검사 시 이 길이보다 짧은 연속 False 구간은 다시 True로 메움 [m]
    paint_min_false_length: 0.5
    # 분사 T/F 검사 시 양옆이 False인 경우, 이 길이보다 짧은 연속 True 구간은 False로 메움 [m]
    paint_min_true_length: 0.005

  structuring:
    # 구조화된 PaintingTrajectory의 frame_id
    frame_id: world
    # 구조화된 PaintingTrajectory와 trajectory별 CSV 파일을 저장할지 여부
    save_csv: true
    # 비워두면 path_planning/log/<실행일시>에 저장
    csv_output_dir: ""
    # PaintingTrajectory 전체 waypoint를 하나로 모아 저장하는 CSV 파일 이름
    painting_trajectory_csv_name: painting_trajectory.csv
    # trajectory별 CSV 파일 이름 형식. 사용 가능: {row_index}, {row_number}
    trajectory_csv_name_format: trajectory_{row_index:03d}.csv
