# 상대 경로는 이 YAML 파일 기준. ROS 없이 scan/control 별도 Python 프로세스 사용.
control_python: ~/miniconda3/envs/vehicle_painting_robot_control/bin/python
control_wrapper: ../../../robot_control/doosan_a0912_controller/test/scripts/joint_target_test.py
control_library: ../../../robot_control/doosan_a0912_controller/test/build-scan/libdoosan_controller_c_api.so
xacro: ../description/xacro/a0912_to_tool_scan.xacro
output_dir: ../log

# 실제 장착 방향, 관절 영점/축, 카메라 nominal TF를 확인한 후에만 true.
# 현재 Xacro의 TF를 그대로 사용하며 자동 hand-eye 보정은 하지 않습니다.
mounting_tf_confirmed: false

robot:
  ip: 192.168.137.100
  port: 12345
  rt_port: 12347
  connect_timeout_sec: 15
  move_timeout_sec: 120
  max_velocity_deg_s: 5.0
  acceleration_deg_s2: 10.0
  target_tolerance_deg: 0.1
  command_time_sec: 0.01
  # 각 이동의 현재 관절각 대비 최대 변화. 충돌 검사를 대체하지 않습니다.
  max_move_delta_deg: 45.0
  settle_sec: 1.0
  settle_timeout_sec: 10.0
  stationary_velocity_deg_s: 0.05
  capture_drift_deg: 0.05

# 펜던트로 확인한 실제 안전한 J1~J6(deg)를 각각 입력하세요.
# 정면/왼쪽/오른쪽은 대상 부품을 보는 촬영 위치 이름이지 자동 계산 방향이 아닙니다.
# null 상태에서는 --execute를 붙여도 로봇에 연결하지 않습니다.
views:
  - name: front
    joint_deg: null
  - name: left
    joint_deg: null
  - name: right
    joint_deg: null

camera:
  serial_number: ""  # 한 대일 때만 자동 선택. 여러 대면 시리얼 필수.
  # 0: SDK가 제공하는 해당 항목의 기본/첫 Y16 프로파일 선택.
  width: 0
  height: 0
  fps: 0
  warmup_frames: 30
  capture_timeout_sec: 20.0
  min_depth_mm: 200.0
  max_depth_mm: 3000.0
  min_points: 1000

reconstruction:
  voxel_size_mm: 2.0  # 통합본만 다운샘플링. 원본/시점별 PLY는 보존.
  # 로봇 base_link 좌표계 ROI. null이면 깊이 범위 내 전체를 합칩니다.
  roi_min_mm: null  # 예: [300, -500, 0] (실제 대상 위치에 맞게 지정)
  roi_max_mm: null  # 예: [1200, 500, 1500]
